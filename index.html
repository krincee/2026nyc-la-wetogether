<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a4d78">
<title>NYC × LA｜相愛十年闖美之旅</title>
<!-- V7: Google Sheet Cloud Sync -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:ital,wght@0,500;0,600;0,700;1,700&family=Permanent+Marker&family=Noto+Sans+HK:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#f1e6c9;--paper:#fff8e7;--paper2:#f8eed5;--red:#dc2c21;--blue:#0a4d78;--ink:#17364a;--muted:#766e60;--line:#cabc99;--pink:#f6d9d2;--sky:#dcebf0;--mint:#e0eee4;--yellow:#f5e6b1}
*{box-sizing:border-box}html,body{margin:0;background:#082f49;color:var(--ink);font-family:"Noto Sans HK","PingFang HK",Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:radial-gradient(#000 .55px,transparent .8px) 0 0/8px 8px,radial-gradient(#fff .55px,transparent .8px) 2px 3px/11px 11px}
button,input,select{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:82px;box-shadow:0 0 70px #0008}

/* cover */
.cover-wrap{background:var(--cream);position:relative}.cover-names{height:52px;display:flex;align-items:center;justify-content:center;font:700 14px "Oswald";letter-spacing:.07em;color:var(--blue)}
.cover-art{width:100%;display:block}.screen{display:none}.screen.active{display:block}
.header{height:88px;color:#fff;padding:8px 17px;display:flex;justify-content:space-between;align-items:flex-start;position:relative;overflow:hidden}
.header.red{background:var(--red)}.header.blue{background:var(--blue)}.header:after{content:"";position:absolute;inset:0;opacity:.16;background:repeating-linear-gradient(14deg,transparent 0 9px,#fff 9px 10px,transparent 10px 23px)}
.header-main{font:italic 700 51px/.95 "Oswald";letter-spacing:-.04em;text-transform:uppercase;z-index:1}.header-side{font:700 17px/1.05 "Oswald";text-align:right;text-transform:uppercase;z-index:1}
.topbar{display:none;position:sticky;top:0;z-index:25;background:var(--blue);color:#fff;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:5px solid var(--red)}.topbar button{background:none;border:0;color:#fff;font-size:27px}.topbar b{font:700 25px "Oswald"}
.pad{padding:15px}

/* Today */
.city{font:italic 700 42px/1 "Oswald";color:var(--blue);text-transform:uppercase;padding:15px 17px 5px}.weather{display:grid;grid-template-columns:1fr .9fr;gap:9px;background:var(--paper);padding:12px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.weather-left{display:flex;gap:10px;align-items:center}.weather-icon{font-size:38px}.weather-temp{font:700 30px/1 "Oswald"}.weather-meta{font-size:12px;line-height:1.5}
.tape{display:inline-block;background:#dfcd9c;padding:8px 22px 7px;margin:12px 0 8px 25px;transform:rotate(-3deg);font:700 27px "Oswald";color:var(--blue)}.hand{font-family:"Permanent Marker";font-size:20px;color:var(--red);display:inline-block;transform:rotate(-5deg)}
.timeline{padding:4px 18px 14px}.tl{display:grid;grid-template-columns:58px 22px 1fr;gap:8px;padding:11px 0;align-items:start;border-bottom:1px dashed #d3c59e}.tl-time{font:700 17px "Oswald"}.tickbox{width:20px;height:20px;border:2px solid var(--blue)}.tl-text{font-weight:800;line-height:1.32}
.primary{width:100%;border:0;background:var(--red);color:#fff;padding:12px 15px;font-weight:900}

/* Days */
.day-list{padding:10px 14px 18px}.day-row{display:grid;grid-template-columns:72px 1fr 18px;gap:10px;padding:12px 6px;border-bottom:1px solid var(--line);background:var(--paper)}.day-no{font:700 23px/1 "Oswald";color:var(--blue)}.day-no small{display:block;font-size:13px;color:var(--red);margin-top:4px}.day-row b{font-size:14px}.day-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}

/* detail */
.detail-intro{padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line)}.detail-day{font:700 18px "Oswald";color:var(--red)}.detail-title{font:700 30px/1.05 "Oswald";color:var(--blue);margin:5px 0}.detail-region{font-size:12px;font-weight:900}
.section-stack{padding:14px}.place-card,.info-card,.transit-card{background:var(--paper);border:1px solid #d4c6a2;border-radius:26px;margin:0 0 18px;overflow:hidden;box-shadow:0 2px 0 rgba(12,50,73,.04)}
.place-top{padding:17px 18px 11px}.place-title{font:700 28px/1.08 "Oswald";color:var(--ink)}.stars{font-size:22px;letter-spacing:3px;color:#f39a18;margin-top:8px;line-height:1;display:flex;gap:3px}
.star-half{position:relative;display:inline-block;color:#cfc4aa}
.star-half:before{content:"★";position:absolute;left:0;top:0;width:52%;overflow:hidden;color:#f39a18}.place-photo{height:205px;background:linear-gradient(135deg,#d9ebf0,#f6dccf);position:relative;overflow:hidden;border-top:1px solid #e2d6b9;border-bottom:1px solid #e2d6b9}.place-photo img{width:100%;height:100%;object-fit:cover;display:block}.photo-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:700 24px/1.15 "Oswald";color:var(--blue);background:repeating-linear-gradient(-45deg,#e8ddc0 0 12px,#f5ead0 12px 24px)}.photo-badge{position:absolute;left:12px;bottom:10px;background:rgba(10,77,120,.92);color:white;padding:5px 8px;font:700 11px "Oswald";letter-spacing:.04em}
.groups{padding:12px}.group{padding:12px 13px;border-radius:17px;margin:8px 0;border:1px solid rgba(10,77,120,.08)}.group.plain{background:#fffdf5}.group.meta{background:var(--sky)}.group.photo{background:#e7edf3}.group.movie{background:#e5edf0}.group.parking{background:#e0e8ef}.group.warn{background:var(--pink)}.group.food{background:#f6ead2}.group.shop{background:#eee2cd}.group.halloween{background:#f5ddd2}.group.pop{background:#e9e5d8}.group.moment{background:#f5d7d3}.group.tip{background:var(--yellow)}
.group-label{font-weight:900;font-size:13px;color:var(--blue);margin-bottom:6px}.group.warn .group-label,.group.moment .group-label{color:var(--red)}.group p{margin:4px 0;line-height:1.48;font-size:14px}.group strong{font-weight:900}
.transit-card{padding:15px 17px;border-radius:23px;background:linear-gradient(135deg,#e5edf1,#fff8e7)}.transit-label{font:700 14px "Oswald";color:var(--blue);margin-bottom:7px}.transit-card p{margin:4px 0;font-size:14px;line-height:1.48}
.info-card{padding:15px 17px;border-radius:23px}.info-card.warn{background:var(--pink)}.info-card.food{background:#f7ead1}.info-card.summary{background:#e4edf0}.info-card.walk{background:#edf0e5}.info-card p{margin:4px 0;line-height:1.5;font-size:14px}

/* money */

.syncbar{margin:8px 13px 0;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fffdf7;font:700 11px "Oswald";letter-spacing:.03em;color:var(--blue);display:flex;align-items:center;justify-content:space-between;gap:8px}
.syncbar .dot{font-size:13px}.syncbar.ok{background:#e5efe7;color:#17613f}.syncbar.busy{background:#f5e6b1;color:#6b4f00}.syncbar.offline{background:#f6d9d2;color:#9d1f16}.syncbar.error{background:#f6d9d2;color:#9d1f16}
.syncbar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:4px 7px;font:700 10px "Oswald"}
.device-panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0 14px}
.device-panel h3{margin:0 0 8px;color:var(--red);font:700 17px "Oswald"}
.device-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.device-grid button{border:1px solid var(--line);background:#fffdf7;border-radius:9px;padding:9px 3px;font-weight:900;color:var(--blue)}
.device-grid button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.cloud-note{font-size:11px;line-height:1.45;color:var(--muted);margin-top:8px}

.money-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:10px 13px 0}.money-tabs button{border:1px solid var(--line);padding:9px 3px;background:var(--paper);font:700 14px "Oswald";color:var(--blue)}.money-tabs button.active{background:var(--red);color:white}.money-body{padding:13px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}.money-heading{text-align:center;color:var(--red);font:700 22px "Oswald";margin-bottom:12px}
.fg{margin-bottom:12px}.fg>label{font-size:12px;font-weight:900;display:block;margin:0 0 6px}.field{width:100%;padding:12px;border:1px solid #d8caa8;background:#fffdf7;border-radius:10px}.twocol{display:grid;grid-template-columns:1fr 110px;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.seg.two{grid-template-columns:repeat(2,1fr)}.seg label{margin:0}.seg input{display:none}.seg span{display:block;text-align:center;padding:10px 5px;border:1px solid var(--line);border-radius:9px;background:#fffdf7;font-weight:900;font-size:13px}.seg input:checked+span{background:var(--red);border-color:var(--red);color:#fff}
.split{display:flex;gap:7px;flex-wrap:wrap}.split label{display:flex;gap:5px;align-items:center;background:#fffdf7;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-weight:800;font-size:13px}.split input{accent-color:var(--blue)}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cat{border:1px solid var(--line);border-radius:9px;background:#fffdf7;padding:9px 4px;font-size:11px;font-weight:900}.cat.active{background:var(--red);color:#fff}.other{display:none;margin-top:8px}
.expense{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.expense small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.amount{font:700 18px "Oswald";white-space:nowrap}.del{background:none;border:0;color:var(--red);font-weight:900;font-size:11px}.balance{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.balance b{font:700 24px "Oswald"}.paid-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.paid-card{background:#e5efe7;border-radius:16px;padding:11px;text-align:center}.paid-card:nth-child(2){background:#f5e2e0}.paid-card h3{margin:0;font-size:14px}.paid-card b{font:700 20px "Oswald"}

/* packing / menu */
.progress{height:13px;background:#d1c8b1;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue)}.pack-group{background:var(--paper);border-radius:24px;border:1px solid var(--line);padding:14px;margin-bottom:13px}.pack-group h3{margin:0 0 7px;color:var(--red);font-size:16px}.pack-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed #d8cba9}.pack-row:last-child{border:0}.pack-row input{accent-color:var(--blue);width:18px;height:18px}.menu{padding:14px}.menu-btn{width:100%;padding:14px;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--paper);font-weight:900}.always{text-align:right;font-family:"Permanent Marker";font-size:27px;color:var(--blue);padding:26px 10px}

/* bottom */
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-top:2px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}.tab{border:0;background:transparent;color:var(--blue);padding:7px 2px 6px;font:700 12px "Oswald"}.tab i{font-style:normal;display:block;font-size:21px;margin-bottom:2px}.tab.active{background:var(--red);color:#fff}
@media(min-width:820px){.app{margin:18px auto;border-radius:18px;overflow:hidden}.bottom{bottom:18px;border-radius:0 0 18px 18px}}
</style>
</head>

function queueGet(){return get('syncQueue',[])}
function queuePut(q){put('syncQueue',q)}
function enqueue(action,payload){
  const q=queueGet();
  q.push({qid:makeId(),action,payload,queuedAt:Date.now()});
  queuePut(q);
  setSyncStatus(navigator.onLine?'busy':'offline',navigator.onLine?`SYNCING · ${q.length} PENDING`:`OFFLINE · ${q.length} PENDING`);
}
function syncClock(){
  return new Date().toLocaleTimeString([],
    {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function setSyncStatus(kind,text){
  const q=queueGet().length;
  const msg=text||(kind==='ok'?`SYNCED · ${syncClock()}`:kind==='busy'?`SYNCING · ${q} PENDING`:kind==='offline'?`OFFLINE · ${q} PENDING`:'SYNC ERROR');
  ['syncStatus','packSyncStatus','menuSyncStatus'].forEach(id=>{
    const n=$(id); if(!n)return;
    n.className='syncbar '+kind;
    n.innerHTML=`<span><span class="dot">●</span> ${esc(msg)}</span><button onclick="manualSync()">SYNC NOW</button>`;
  });
}
function apiGet(action='getAll',timeout=12000){
  return new Promise((resolve,reject)=>{
    const cb='__tripcb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const sc=document.createElement('script');
    let done=false;
    const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch{window[cb]=undefined};sc.remove()};
    window[cb]=(data)=>{cleanup();resolve(data)};
    sc.onerror=()=>{cleanup();reject(new Error('Cloud read failed'))};
    sc.src=API_URL+'?action='+encodeURIComponent(action)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
    const timer=setTimeout(()=>{cleanup();reject(new Error('Cloud read timeout'))},timeout);
    document.head.appendChild(sc);
  });
}
async function apiPost(payload){
  const body=new URLSearchParams();
  body.set('payload',JSON.stringify(payload));
  await fetch(API_URL,{
    method:'POST',
    mode:'no-cors',
    cache:'no-store',
    headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
    body:body.toString()
  });
}
function applyRemote(data,rerender=true){
  if(!data||data.ok===false)throw new Error(data?.error||'Cloud returned an error');
  lastRemote={
    expenses:Array.isArray(data.expenses)?data.expenses:[],
    packing:data.packing||{}
  };
  const active=lastRemote.expenses.filter(e=>!e.deleted);
  put('expenses',active);
  put('packing',lastRemote.packing);
  if(!rerender)return;
  const activeScreen=document.querySelector('.screen.active')?.id;
  const editing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
  if(activeScreen==='money'&&!editing)renderMoney(moneyTab);
  if(activeScreen==='packing'&&!editing)renderPacking(false);
  if(activeScreen==='today'&&tripDay()===0)renderToday();
}
function verifyOp(op,data){
  if(!data||!Array.isArray(data.expenses))return false;
  if(op.action==='upsertExpense'){
    const e=data.expenses.find(x=>String(x.id)===String(op.payload.id));
    return !!e&&!e.deleted;
  }
  if(op.action==='deleteExpense'){
    const e=data.expenses.find(x=>String(x.id)===String(op.payload.id));
    return !!e&&!!e.deleted;
  }
  if(op.action==='restoreExpense'){
    const e=data.expenses.find(x=>String(x.id)===String(op.payload.id));
    return !!e&&!e.deleted;
  }
  if(op.action==='updatePacking'){
    return Boolean((data.packing||{})[op.payload.key])===Boolean(op.payload.checked);
  }
  return true;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function flushSyncQueue(forceRead=false){
  if(syncBusy)return;
  if(!navigator.onLine){setSyncStatus('offline');return}
  syncBusy=true;setSyncStatus('busy','SYNCING…');
  try{
    let q=queueGet();
    while(q.length){
      const op=q[0];
      const payload={action:op.action,...op.payload,clientId:getClientId(),deviceName:getDeviceName()};
      await apiPost(payload);
      await sleep(650);
      const probe=await apiGet('getAll');
      if(!probe.ok||!verifyOp(op,probe))throw new Error('Write sent but not verified yet');
      q.shift();queuePut(q);applyRemote(probe,false);
    }
    const data=forceRead||!lastRemote.expenses.length?await apiGet('getAll'):lastRemote;
    if(data&&data.ok!==undefined)applyRemote(data,true);
    else if(forceRead)applyRemote(await apiGet('getAll'),true);
    setSyncStatus('ok');
  }catch(err){
    console.warn('Trip sync:',err);
    setSyncStatus(navigator.onLine?'error':'offline',navigator.onLine?'SYNC ERROR · TAP SYNC NOW':undefined);
  }finally{syncBusy=false}
}
async function manualSync(){
  await flushSyncQueue(true);
}
async function cloudRefresh(){
  if(syncBusy||!navigator.onLine)return;
  syncBusy=true;setSyncStatus('busy','CHECKING CLOUD…');
  try{
    const data=await apiGet('getAll');
    applyRemote(data,true);
    setSyncStatus(queueGet().length?'busy':'ok');
  }catch(e){
    console.warn(e);setSyncStatus('error','CLOUD READ ERROR');
  }finally{syncBusy=false}
}

function startSyncLoop(){
  clearInterval(syncTimer);
  syncTimer=setInterval(()=>{
    if(document.visibilityState==='visible'&&activeNeedsPolling()){
      if(queueGet().length)flushSyncQueue(true); else cloudRefresh();
    }
  },SYNC_INTERVAL_MS);
}

async function discoverPhoto(query){
 // 1) Wikimedia Commons — actual CC/Commons photography
 try{
  const url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=4&gsrsearch='+encodeURIComponent(query)+'&prop=imageinfo&iiprop=url&iiurlwidth=900&format=json&origin=*';
  const r=await fetch(url);const j=await r.json();const pages=Object.values(j.query?.pages||{});
  for(const p of pages){const u=p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url;if(u)return u}
 }catch(e){}
 // 2) Openverse fallback
 try{
  const r=await fetch('https://api.openverse.org/v1/images/?page_size=5&q='+encodeURIComponent(query));
  const j=await r.json();for(const x of (j.results||[])){if(x.thumbnail)return x.thumbnail;if(x.url)return x.url}
 }catch(e){}
 return '';
}
async function hydratePhotos(){

  const img=box.querySelector('img'), fallback=box.querySelector('.photo-fallback');

  if(url){
    img.src=url;
    img.onload=()=>fallback.style.display='none';
    img.onerror=async()=>{const u=await discoverPhoto(box.dataset.query);if(u){img.src=u;img.onload=()=>fallback.style.display='none'}}
  }else{
    const u=await discoverPhoto(box.dataset.query);if(u){img.src=u;img.onload=()=>fallback.style.display='none'}
  }
 }
}

   const xs=(d.expenses||[]).map(e=>({...e,id:e.id||makeId()}));
   put('expenses',xs);
   xs.forEach(e=>enqueue('upsertExpense',e));
   const p=d.packing||{};put('packing',p);
   Object.entries(p).forEach(([key,checked])=>enqueue('updatePacking',{key,checked:Boolean(checked)}));
   alert('Backup 已載入，正在同步到 Google Sheet。');
   renderMoney('expenses');flushSyncQueue(true);
  }catch{alert('Backup file 格式有問題。')}
 };
 r.readAsText(file)
}

 const dev=getDeviceName();
 $('menu').innerHTML=header('blue','MENU','★')+`<div class="menu">
 <div id="menuSyncStatus" class="syncbar busy" style="margin:0 0 10px"><span><span class="dot">●</span> CLOUD SYNC</span><button onclick="manualSync()">SYNC NOW</button></div>
 <div class="device-panel"><h3>THIS DEVICE</h3><div class="device-grid">${['Krince','Silke','Ernest'].map(p=>`<button class="${dev===p?'active':''}" onclick="setDeviceName('${p}')">${p}</button>`).join('')}</div><div class="cloud-note">只用作 Audit Log 標示邊部電話做咗操作；Paid by 仍然每筆自行選擇。</div></div>

 <div class="always">Collect Moments.<br>Not Things.<br><small>Always.</small></div></div>`;
 setSyncStatus(navigator.onLine?(queueGet().length?'busy':'ok'):'offline');
}
function showPacking(){show('packing');renderPacking()}
function renderPacking(doRefresh=true){const state=get('packing',{}),all=Object.entries(PACKING).flatMap(([g,a])=>a.map(i=>g+'|'+i)),done=all.filter(k=>state[k]).length,pct=Math.round(done/all.length*100)||0;$('packing').innerHTML=header('blue','BEFORE TRIP','PACKING<br>CHECKLIST')+`<div id="packSyncStatus" class="syncbar busy"><span><span class="dot">●</span> CLOUD SYNC</span><button onclick="manualSync()">SYNC NOW</button></div><div class="pad"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:end"><b style="font:700 21px Oswald;color:var(--red)">PACKING PROGRESS</b><b style="font:700 30px Oswald">${pct}%</b></div><div class="progress"><span style="width:${pct}%"></span></div><div style="margin-top:9px"><button class="del" onclick="resetPacking()">RESET CHECKLIST</button></div></div>${Object.entries(PACKING).map(([g,a])=>`<div class="pack-group"><h3>${g}</h3>${a.map(i=>{const key=g+'|'+i;return `<label class="pack-row"><input type="checkbox" ${state[key]?'checked':''} onchange="togglePack('${encodeURIComponent(key)}',this.checked)"><span>${esc(i)}</span></label>`}).join('')}</div>`).join('')}</div>`}
function togglePack(k,v){const key=decodeURIComponent(k),s=get('packing',{});s[key]=v;put('packing',s);enqueue('updatePacking',{key,checked:Boolean(v)});renderPacking(false);flushSyncQueue(true)}
function resetPacking(){
 if(!confirm('你是否確認清除所有 Packing Checklist 剔選？\nGoogle Sheet 上嘅 checklist 亦會同步改為未完成。'))return;
 const empty={};put('packing',empty);
 Object.entries(PACKING).flatMap(([g,a])=>a.map(i=>g+'|'+i)).forEach(key=>enqueue('updatePacking',{key,checked:false}));
 renderPacking(false);flushSyncQueue(true);
}

/* NAV */
function show(id){
 document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.s===id));
 $('cover').style.display=id==='today'?'block':'none';$('topbar').style.display=id==='today'?'none':'flex';
 $('back').style.visibility=(id==='detail'||id==='packing')?'visible':'hidden';
 $('topname').textContent=id==='days'?'12 DAYS':id==='money'?'MONEY':id==='menu'?'MENU':id==='packing'?'BEFORE TRIP':'DAY';
 if(id==='today')renderToday();if(id==='days')renderDays();if(id==='money')renderMoney(moneyTab);if(id==='menu')renderMenu();
 if(id==='money'||id==='packing')setTimeout(()=>{if(queueGet().length)flushSyncQueue(true);else cloudRefresh()},60);
 window.scrollTo(0,0)
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.s));$('back').onclick=()=>show('days');
migrateLegacyLocalData();
renderToday();renderDays();renderMoney();renderMenu();
startSyncLoop();
setTimeout(()=>{if(queueGet().length)flushSyncQueue(true);else cloudRefresh()},350);
window.addEventListener('online',()=>flushSyncQueue(true));
window.addEventListener('offline',()=>setSyncStatus('offline'));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(queueGet().length)flushSyncQueue(true);else cloudRefresh()}});

</script>
